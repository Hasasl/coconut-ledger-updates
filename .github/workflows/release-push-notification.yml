name: Notify Android users about app releases

on:
  workflow_call:
    inputs:
      version:
        description: Shared page and Android version that was published
        required: true
        type: string
    secrets:
      SUPABASE_URL:
        required: true
      PUSH_RELEASE_SECRET:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send release notification
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUSH_RELEASE_SECRET: ${{ secrets.PUSH_RELEASE_SECRET }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node <<'NODE'
          if (!/^\d+\.\d+(?:\.\d+)?$/.test(process.env.RELEASE_VERSION || "")) {
            throw new Error("The release workflow supplied an invalid version");
          }
          (async () => {
            const response = await fetch(`${process.env.SUPABASE_URL}/functions/v1/push-notifications`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "X-Release-Token": process.env.PUSH_RELEASE_SECRET,
              },
              body: JSON.stringify({ event: "release", version: process.env.RELEASE_VERSION }),
            });
            if (!response.ok) {
              console.error(`Release notification failed (${response.status}).`);
              process.exitCode = 1;
            }
          })().catch((error) => {
            console.error("Could not send release notification:", error.message);
            process.exitCode = 1;
          });
          NODE
