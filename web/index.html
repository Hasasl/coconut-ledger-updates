<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Coconut Estate Ledger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script>
      /* Colours and language before the first paint, so the loading screen matches the app. */
      try {
        if (localStorage.getItem("coconut-ledger-skin") === "light")
          document.documentElement.setAttribute("data-skin", "light");
        if (localStorage.getItem("coconut-ledger-lang") === "si") document.documentElement.lang = "si";
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- Loading screen: a palm sways, a lorry drives in, coconuts drop into it, and it drives away.
         Every part moves with transform/opacity only, so it stays smooth while the app builds its tabs. -->
    <div id="loader" aria-hidden="true">
      <div class="ld-scene">
        <div class="ld-moon"></div>
        <svg class="ld-ground" viewBox="0 0 300 180" preserveAspectRatio="none">
          <path class="ld-trunk" d="M96 172 C100 132 108 92 118 54" />
          <path class="ld-rings" d="M96 172 C100 132 108 92 118 54" />
          <rect class="ld-land" x="0" y="170" width="300" height="10" rx="5" />
        </svg>
        <div class="ld-crown">
          <svg viewBox="0 0 120 80">
            <g class="ld-leaves">
              <g transform="translate(60 40) rotate(-12)"><path d="M0 0 Q26 -15 58 7 Q28 -4 0 0Z" /></g>
              <g transform="translate(60 40) rotate(-48)"><path d="M0 0 Q24 -12 50 6 Q25 -3 0 0Z" /></g>
              <g transform="translate(60 40) rotate(-84)"><path d="M0 0 Q20 -10 40 5 Q20 -2 0 0Z" /></g>
              <g transform="translate(60 40) scale(-1 1) rotate(-12)"><path d="M0 0 Q26 -15 58 7 Q28 -4 0 0Z" /></g>
              <g transform="translate(60 40) scale(-1 1) rotate(-48)"><path d="M0 0 Q24 -12 50 6 Q25 -3 0 0Z" /></g>
              <g transform="translate(60 40) rotate(22)"><path d="M0 0 Q22 -6 46 12 Q22 4 0 0Z" /></g>
              <g transform="translate(60 40) scale(-1 1) rotate(22)"><path d="M0 0 Q22 -6 46 12 Q22 4 0 0Z" /></g>
            </g>
            <g class="ld-nuts">
              <circle cx="54" cy="47" r="5.5" />
              <circle cx="65" cy="47" r="5.5" />
              <circle cx="59.5" cy="53" r="5.5" />
            </g>
          </svg>
        </div>
        <i class="ld-drop d1"></i><i class="ld-drop d2"></i><i class="ld-drop d3"></i>
        <div class="ld-lorry">
          <i class="ld-load"></i>
          <svg viewBox="0 0 130 50">
            <rect class="ld-chassis" x="0" y="31" width="128" height="6" rx="2" />
            <rect class="ld-bed" x="2" y="12" width="76" height="21" rx="3" />
            <path class="ld-slat" d="M10 17H70M10 23H70M10 29H70" />
            <rect class="ld-cab" x="81" y="5" width="40" height="28" rx="6" />
            <rect class="ld-glass" x="97" y="9" width="19" height="11" rx="2" />
            <rect class="ld-chassis" x="117" y="25" width="11" height="8" rx="2" />
            <circle class="ld-lamp" cx="125" cy="22" r="2" />
          </svg>
          <i class="ld-wheel w1"
            ><svg viewBox="0 0 18 18">
              <circle cx="9" cy="9" r="8" />
              <path d="M9 3V15M3 9H15" /></svg
          ></i>
          <i class="ld-wheel w2"
            ><svg viewBox="0 0 18 18">
              <circle cx="9" cy="9" r="8" />
              <path d="M9 3V15M3 9H15" /></svg
          ></i>
        </div>
      </div>
      <div class="ld-name">Coconut Ledger</div>
      <div class="ld-bar"><i id="ldBar"></i></div>
      <p class="ld-tag">
        <span class="en">Getting your estate ready…</span><span class="si">ඔබේ වත්ත සූදානම් කරමින්…</span>
      </p>
    </div>
    <div class="app">
      <nav class="rail" aria-label="Sections">
        <i class="rail-ind" aria-hidden="true"></i>
        <div class="brand">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="16" cy="18" r="10" />
            <circle cx="12.5" cy="15.5" r="1" fill="currentColor" />
            <circle cx="19.5" cy="15.5" r="1" fill="currentColor" />
            <circle cx="16" cy="20" r="1" fill="currentColor" />
            <path d="M16 8c0-3 2-5 5-5M16 8c0-2-2-4-5-4" /></svg
          >Estate Ledger
        </div>
        <button data-go="overview">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" /></svg
          ><span data-t="nav_overview"></span>
        </button>
        <button data-go="months">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="5" width="18" height="16" rx="2" />
            <path d="M3 10h18M8 3v4M16 3v4" /></svg
          ><span data-t="nav_months"></span>
        </button>
        <button data-go="insights">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M4 20V10M10 20V4M16 20v-7M22 20H2" /></svg
          ><span data-t="nav_insights"></span>
        </button>
        <button data-go="forecast">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 17l5-5 4 3 8-9" />
            <path d="M15 6h5v5" /></svg
          ><span data-t="nav_forecast"></span>
        </button>
        <button data-go="data">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <ellipse cx="12" cy="6" rx="8" ry="3" />
            <path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6" /></svg
          ><span data-t="nav_data"></span>
        </button>
        <div class="rail-foot" data-t="rail_foot"></div>
      </nav>
      <main class="main">
        <div class="top">
          <h1><span id="estateName"></span><span class="sub" id="viewSub"></span></h1>
          <div class="seg lang" role="group" aria-label="Language">
            <button data-lang="en" lang="en">English</button><button data-lang="si" lang="si">සිංහල</button>
          </div>
          <button class="iconbtn" id="skinBtn" aria-label="Switch between neon and light colours">
            <svg
              class="ic-moon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" /></svg
            ><svg
              class="ic-sun"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19" />
            </svg>
          </button>
          <span class="chip" id="sync"><i></i><span></span></span>
          <button class="btn primary add" data-add data-t="add_harvest"></button>
        </div>
        <div id="view"></div>
      </main>
    </div>
    <button class="btn primary fab" data-add data-t="add_short"></button>
    <div id="tip" role="status"></div>
    <div id="toast" role="status"></div>
    <div id="report"></div>

    <dialog id="dlg" aria-labelledby="dlgTitle">
      <form class="sheet" id="hform" novalidate>
        <header>
          <h2 id="dlgTitle"></h2>
          <button type="button" class="x" data-close aria-label="Close">×</button>
        </header>
        <div class="fields">
          <label class="fld"><span data-t="f_date"></span><input id="f-date" type="date" required /></label>
          <label class="fld lead"
            ><span><span data-t="f_price"></span> (<span class="curlab"></span>)</span
            ><input id="f-price" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00"
          /></label>
          <label class="fld lead"
            ><span data-t="f_total"></span
            ><input id="f-total" type="number" inputmode="numeric" min="0" step="1" placeholder="0"
          /></label>
          <label class="fld lead"
            ><span data-t="f_loaded"></span
            ><input id="f-loaded" type="number" inputmode="numeric" min="0" step="1" placeholder="0"
          /></label>
          <label class="fld"
            ><span data-t="f_home"></span
            ><input id="f-home" type="number" inputmode="numeric" min="0" step="1" placeholder="0"
          /></label>
          <label class="fld"
            ><span id="freeLab"></span><input id="f-free" type="number" inputmode="numeric" min="0" step="1"
          /></label>
        </div>
        <div class="sect"><span data-t="buyer"></span></div>
        <div class="fields">
          <label class="fld"
            ><span data-t="f_bname"></span><input id="f-buyer" type="text" maxlength="60" autocomplete="off"
          /></label>
          <label class="fld"
            ><span data-t="f_bcontact"></span
            ><input id="f-contact" type="tel" maxlength="30" autocomplete="off" data-tp="phone_ph"
          /></label>
        </div>
        <div class="sect">
          <span><span data-t="deductions"></span> (<span class="curlab"></span>)</span
          ><button type="button" class="btn small" id="copyLast" data-t="copy_prev"></button>
        </div>
        <div class="fields ded" id="dedFields"></div>
        <div class="custom-ded-head">
          <b data-t="custom_ded"></b>
          <button type="button" class="btn small" id="addCustomDed" data-t="add_custom_ded"></button>
        </div>
        <div class="custom-ded-list" id="customDedFields"></div>
        <div class="rounding-tools">
          <label class="fld"
            ><span><span data-t="round_total"></span> (<span class="curlab"></span>)</span
            ><input id="f-ded-target" type="number" inputmode="decimal" min="0" step="1" placeholder="0"
          /></label>
          <button type="button" class="btn small" id="applyRounding" data-t="round_apply"></button>
          <p class="hint" id="roundingInfo" aria-live="polite"></p>
        </div>
        <div class="custom-ded-head"><b data-t="share_deductions"></b></div>
        <div class="custom-ded-list" id="shareDedFields"></div>
        <div class="custom-ded-head"><b data-t="share_additions"></b></div>
        <p class="hint" data-t="share_add_hint"></p>
        <div class="custom-ded-list" id="shareAddFields"></div>
        <label class="fld"
          ><span data-t="f_othernote"></span><input id="f-othernote" type="text" maxlength="80" data-tp="othernote_ph"
        /></label>
        <div class="fields">
          <label class="fld"
            ><span data-t="entered_by"></span><input id="f-by" type="text" maxlength="40" data-tp="by_ph"
          /></label>
          <label class="fld"><span data-t="f_note"></span><input id="f-note" type="text" maxlength="140" /></label>
        </div>
        <div class="live" aria-live="polite">
          <div><span data-t="rejected"></span><b class="num" id="l-paid">0</b></div>
          <div><span data-t="income"></span><b class="num" id="l-inc">0</b></div>
          <div><span data-t="balance"></span><b class="num" id="l-net">0</b></div>
          <div><span id="l-shareLab"></span><b class="num" id="l-share">0</b></div>
        </div>
        <ul class="share-ded-live num" id="shareDedLive" aria-live="polite"></ul>
        <p class="err" id="f-err"></p>
        <footer>
          <button type="button" class="btn danger" id="delBtn" data-t="delete"></button><span style="flex: 1"></span
          ><button type="button" class="btn" data-close data-t="cancel"></button
          ><button type="submit" class="btn primary" data-t="save_h"></button>
        </footer>
      </form>
    </dialog>
    <dialog id="incomeDlg" aria-labelledby="incomeDlgTitle">
      <form class="sheet" id="incomeForm" novalidate>
        <header>
          <h2 id="incomeDlgTitle"></h2>
          <button type="button" class="x" data-close-income aria-label="Close">×</button>
        </header>
        <div class="fields">
          <label class="fld"><span data-t="income_month"></span><input id="incomeDate" type="month" required /></label>
          <label class="fld"><span><span data-t="income_amount"></span> (<span class="curlab"></span>)</span><input id="incomeAmount" type="number" inputmode="decimal" min="0.01" step="0.01" /></label>
          <label class="fld wide"><span data-t="income_note"></span><input id="incomeNote" type="text" maxlength="140" /></label>
        </div>
        <p class="hint" data-t="income_hint"></p>
        <p class="err" id="incomeErr"></p>
        <footer>
          <button type="button" class="btn danger" id="incomeDel"></button><span style="flex: 1"></span>
          <button type="button" class="btn" data-close-income data-t="cancel"></button>
          <button type="submit" class="btn primary" data-t="save_h"></button>
        </footer>
      </form>
    </dialog>
    <dialog id="ask" aria-labelledby="askT">
      <div class="sheet">
        <header><h2 id="askT"></h2></header>
        <p id="askP" style="margin: 0; color: var(--ink-2)"></p>
        <footer>
          <button class="btn" id="askNo" data-t="cancel"></button><button class="btn primary" id="askYes"></button>
        </footer>
      </div>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
