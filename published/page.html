<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Coconut Estate Ledger</title>
    <style>
/* Layout idea: price and coconut count lead, large and glowing. Everything else is a smaller ledger underneath. Rail on the left, bottom bar on phones.
   One visual world by choice: neon on deep blue-black. A light skin is kept behind the header switch for bright sunlight. */
:root {
  --bg: #060a13;
  --surface: #0d1422;
  --surface-2: #172135;
  --line: #24324d;
  --ink: #eef4ff;
  --ink-2: #a9b7d0;
  --ink-3: #7385a3;
  --accent: #2bffa0;
  --accent-ink: #03140c;
  --accent-soft: #0f3a2a;
  --accent-2: #22d3ff;
  --husk: #ffb020;
  --husk-soft: #2e230b;
  --good: #2bffa0;
  --warn: #ffb020;
  --bad: #ff6b7a;
  --bad-soft: #3a1520;
  --c1: #16a873;
  --c2: #3d8bff;
  --c3: #e56d28;
  --c4: #bc58dd;
  --hero-bg: linear-gradient(135deg, #0a2b22 0%, #0a1730 62%, #1b1036 100%);
  --hero-ink: #eaf2ff;
  --hero-num: #2bffa0;
  --hero-line: #2bffa0;
  --btn-bg: linear-gradient(90deg, #2bffa0, #22d3ff);
  --bgfx: radial-gradient(900px 520px at 105% -8%, rgba(34, 211, 255, 0.12), transparent 60%),
    radial-gradient(760px 520px at -12% 12%, rgba(43, 255, 160, 0.09), transparent 60%),
    radial-gradient(700px 600px at 50% 115%, rgba(188, 88, 221, 0.08), transparent 60%);
  --mglow: 5px;
  --tglow: 28px;
  --cglow: 0 0 0 1px rgba(43, 255, 160, 0.35), 0 0 34px rgba(43, 255, 160, 0.18);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 30px rgba(0, 0, 0, 0.35);
  --display: "Bricolage Grotesque", "Figtree", "Noto Sans Sinhala", system-ui, -apple-system, "Segoe UI", Roboto,
    sans-serif;
  --body: "Figtree", "Noto Sans Sinhala", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 16px;
  color-scheme: dark;
}
:root[data-skin="light"] {
  --bg: #f2f5ef;
  --surface: #ffffff;
  --surface-2: #e9eee5;
  --line: #d9e0d4;
  --ink: #15231b;
  --ink-2: #4c5d52;
  --ink-3: #7c8b81;
  --accent: #1f7a4d;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe3;
  --accent-2: #1f7a4d;
  --husk: #b4690e;
  --husk-soft: #f6e7d2;
  --good: #1f7a4d;
  --warn: #a8690a;
  --bad: #bf3b26;
  --bad-soft: #f9e1dc;
  --c1: #1f7a4d;
  --c2: #3a78c2;
  --c3: #d98a1f;
  --c4: #9a55b0;
  --hero-bg: #1f7a4d;
  --hero-ink: #ffffff;
  --hero-num: #ffffff;
  --hero-line: transparent;
  --btn-bg: #1f7a4d;
  --bgfx: none;
  --mglow: 0px;
  --tglow: 0px;
  --cglow: none;
  --shadow: 0 1px 2px rgba(21, 35, 27, 0.06), 0 8px 24px rgba(21, 35, 27, 0.06);
  color-scheme: light;
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background: var(--bgfx);
  pointer-events: none;
}
html[lang="si"] body {
  line-height: 1.6;
}
html[lang="si"] .lab,
html[lang="si"] th,
html[lang="si"] .f span,
html[lang="si"] .live span {
  letter-spacing: 0;
  text-transform: none;
}
button,
input,
textarea,
select {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
* {
  -webkit-tap-highlight-color: transparent;
}
button,
a,
label,
summary,
select,
[data-go] {
  touch-action: manipulation;
}
button {
  -webkit-user-select: none;
  user-select: none;
}
:focus:not(:focus-visible) {
  outline: none;
}
a {
  color: var(--accent);
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 6px;
}
h1,
h2,
h3 {
  font-family: var(--display);
  margin: 0;
  text-wrap: balance;
  letter-spacing: -0.01em;
}
.num {
  font-variant-numeric: tabular-nums;
}

.app {
  display: grid;
  grid-template-columns: 1fr;
  min-height: 100%;
}
.rail {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  background: var(--surface);
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-around;
  padding: 6px 4px;
}
.rail .brand,
.rail .rail-foot {
  display: none;
}
.rail button {
  flex: 1;
  min-width: 0;
  background: none;
  border: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 2px;
  border-radius: 12px;
  color: var(--ink-3);
  font-size: 11px;
  font-weight: 600;
  position: relative;
  transition: color 0.2s;
}
.rail-ind {
  position: absolute;
  left: 0;
  top: 0;
  width: 0;
  height: 0;
  border-radius: 14px;
  background: var(--accent-soft);
  box-shadow: 0 0 calc(var(--mglow) * 4) rgba(43, 255, 160, 0.16);
  pointer-events: none;
  z-index: 0;
  will-change: transform;
  transition:
    transform 0.42s cubic-bezier(0.3, 1.2, 0.4, 1),
    width 0.3s,
    height 0.3s;
}
.rail button {
  z-index: 1;
}
.rail button svg {
  width: 22px;
  height: 22px;
  transition: transform 0.25s cubic-bezier(0.3, 1.6, 0.5, 1);
}
.rail button[aria-current="page"] {
  color: var(--accent);
}
.rail button[aria-current="page"] svg {
  transform: translateY(-2px) scale(1.08);
  filter: drop-shadow(0 0 var(--mglow) var(--accent));
}
.main {
  padding: 16px 16px 96px;
  max-width: 1180px;
  width: 100%;
  margin: 0 auto;
  min-width: 0;
}
.top {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.top h1 {
  font-size: 24px;
  flex: 1 1 100%;
  min-width: 0;
  overflow-wrap: anywhere;
}
.top .sub {
  display: block;
  font-family: var(--body);
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-3);
  letter-spacing: 0;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
  padding: 5px 10px;
  border-radius: 99px;
  background: var(--surface-2);
  color: var(--ink-2);
  white-space: nowrap;
}
.chip i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--ink-3);
}
.chip.ok i {
  background: var(--good);
  box-shadow: 0 0 var(--mglow) var(--good);
}
.chip.busy i {
  background: var(--warn);
  animation: pulse 1s infinite;
}
.btn {
  border: 1px solid var(--line);
  background: var(--surface);
  padding: 9px 14px;
  border-radius: 12px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  color: var(--ink);
  transition:
    transform 0.12s,
    background 0.2s,
    border-color 0.2s,
    box-shadow 0.2s;
}
.btn:hover {
  border-color: var(--accent);
}
.btn:active {
  transform: scale(0.96);
}
.iconbtn:active,
.seg button:active,
.rail button:active {
  transform: scale(0.94);
}
.btn.primary {
  background: var(--btn-bg);
  color: var(--accent-ink);
  border-color: transparent;
  box-shadow: 0 0 calc(var(--mglow) * 4) rgba(43, 255, 160, 0.28);
}
:root[data-skin="light"] .btn.primary {
  box-shadow: none;
}
.btn.primary:hover {
  filter: brightness(1.08);
}
.btn.danger {
  color: var(--bad);
}
.btn.small {
  padding: 6px 10px;
  font-size: 13px;
  border-radius: 10px;
}
.fab {
  position: fixed;
  right: 16px;
  bottom: 78px;
  z-index: 21;
  padding: 13px 18px;
  border-radius: 99px;
}
.top .add {
  display: none;
}
.iconbtn {
  border: 1px solid var(--line);
  background: var(--surface);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.iconbtn svg {
  width: 18px;
  height: 18px;
}
#skinBtn {
  position: relative;
  overflow: hidden;
  transition:
    transform 0.12s,
    border-color 0.2s;
}
#skinBtn svg {
  position: absolute;
  transition:
    transform 0.55s cubic-bezier(0.3, 1.4, 0.5, 1),
    opacity 0.3s;
}
#skinBtn .ic-moon {
  transform: rotate(-120deg) scale(0.4);
  opacity: 0;
}
:root[data-skin="light"] #skinBtn .ic-sun {
  transform: rotate(120deg) scale(0.4);
  opacity: 0;
}
:root[data-skin="light"] #skinBtn .ic-moon {
  transform: none;
  opacity: 1;
}

.banner {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  background: var(--husk-soft);
  border: 1px solid var(--husk);
  border-radius: var(--r);
  padding: 12px 14px;
  margin-bottom: 16px;
  font-size: 14px;
}
.banner p {
  margin: 0;
  flex: 1;
  min-width: 200px;
}
.grid {
  display: grid;
  gap: 14px;
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 16px;
  min-width: 0;
}
.card h2 {
  font-size: 16px;
  margin-bottom: 2px;
}
.card .hint {
  color: var(--ink-3);
  font-size: 13px;
  margin: 0 0 10px;
}

.heroes {
  grid-template-columns: 1fr;
}
.lab {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--ink-3);
}
.pval {
  font-family: var(--display);
  font-weight: 700;
  font-size: 68px;
  line-height: 1;
  margin: 8px 0 8px;
  display: flex;
  align-items: baseline;
  gap: 6px 10px;
  flex-wrap: wrap;
}
.pval small {
  font-size: 24px;
  font-weight: 500;
  opacity: 0.8;
}
.pval .per {
  font-family: var(--body);
  font-size: 15px;
  font-weight: 500;
  opacity: 0.85;
}
.pricehero {
  background: var(--hero-bg);
  color: var(--hero-ink);
  border-color: var(--hero-line);
  padding: 20px;
  box-shadow: var(--cglow);
  position: relative;
  animation: rise 0.45s both;
}
.pricehero::after {
  content: "";
  position: absolute;
  inset: -1px;
  border-radius: inherit;
  box-shadow: 0 0 46px rgba(43, 255, 160, 0.3);
  opacity: 0.6;
  pointer-events: none;
}
:root[data-skin="light"] .pricehero::after {
  display: none;
}
.pricehero .lab {
  color: inherit;
  opacity: 0.85;
}
.pricehero .pval > span[data-count],
.pricehero .pval > small {
  color: var(--hero-num);
  text-shadow: 0 0 var(--tglow) var(--hero-num);
}
.pricehero .delta {
  background: rgba(255, 255, 255, 0.14);
  color: inherit;
}
.pricehero .cmp {
  font-size: 13.5px;
  opacity: 0.95;
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.spark {
  margin: 12px 0 4px;
  color: var(--hero-num);
}
.spark svg {
  display: block;
  width: 100%;
  height: 56px;
  overflow: visible;
}
.spark .sp {
  fill: none;
  stroke: currentColor;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  animation: draw 1.1s ease-out 0.15s forwards;
}
.spark circle {
  fill: currentColor;
  animation: fade 0.4s 1s both;
}
.mini {
  display: flex;
  gap: 8px 22px;
  flex-wrap: wrap;
  font-size: 12.5px;
  margin-top: 8px;
}
.mini b {
  display: block;
  font-size: 16px;
  font-family: var(--display);
}
.tothero {
  padding: 20px;
}
.tothero .pval {
  font-size: 52px;
}
.tothero .pval > span[data-count] {
  color: var(--accent-2);
  text-shadow: 0 0 var(--tglow) var(--accent-2);
}
:root[data-skin="light"] .tothero .pval > span[data-count] {
  color: var(--ink);
}
.split {
  display: flex;
  gap: 2px;
  height: 14px;
  border-radius: 7px;
  overflow: hidden;
  margin: 12px 0;
}
.split i {
  display: block;
  min-width: 3px;
  transform-origin: left;
  animation: growx 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
.k1 {
  background: var(--c1);
}
.k2 {
  background: var(--c2);
}
.k3 {
  background: var(--c3);
}
.k4 {
  background: var(--c4);
}
.splitleg {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 14px;
}
.splitleg div {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  font-size: 12.5px;
  color: var(--ink-2);
}
.splitleg i {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  flex: none;
  margin-top: 4px;
}
.splitleg b {
  display: block;
  font-size: 17px;
  color: var(--ink);
  font-family: var(--display);
}

.kpis {
  grid-template-columns: repeat(2, 1fr);
}
.kpi {
  padding: 14px;
}
.kpi .val {
  font-family: var(--display);
  font-weight: 700;
  font-size: 26px;
  line-height: 1.15;
  margin-top: 4px;
  overflow-wrap: anywhere;
}
.kpi .val small {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink-3);
  margin-right: 3px;
}
.kpi .foot {
  font-size: 12.5px;
  color: var(--ink-2);
  margin-top: 4px;
}
.kpis.sm .kpi {
  padding: 11px 13px;
}
.kpis.sm .lab {
  font-size: 11px;
}
.kpis.sm .val {
  font-size: 19px;
}
.kpis.sm .val small {
  font-size: 12px;
}
.kpis.sm .foot {
  font-size: 12px;
}
.delta {
  font-weight: 700;
  font-size: 12px;
  padding: 2px 7px;
  border-radius: 99px;
  background: var(--surface-2);
  color: var(--ink-2);
  white-space: nowrap;
}
.delta.up {
  background: var(--accent-soft);
  color: var(--good);
}
.delta.down {
  background: var(--bad-soft);
  color: var(--bad);
}
.two {
  grid-template-columns: 1fr;
}
.hero {
  display: flex;
  gap: 18px;
  align-items: center;
  flex-wrap: wrap;
}
.ring {
  position: relative;
  width: 112px;
  height: 112px;
  flex: none;
}
.ring svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
  overflow: visible;
}
.ring circle {
  fill: none;
  stroke-width: 10;
}
.ring .track {
  stroke: var(--surface-2);
}
.ring .prog {
  stroke: var(--accent);
  stroke-linecap: round;
  transition: stroke-dashoffset 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
  filter: drop-shadow(0 0 var(--mglow) var(--accent));
}
.ring .mid {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}
.ring .mid b {
  font-family: var(--display);
  font-size: 26px;
  line-height: 1;
}
.ring .mid span {
  font-size: 11px;
  color: var(--ink-3);
  font-weight: 600;
}
.hero .txt {
  flex: 1;
  min-width: 190px;
}
.hero .big {
  font-family: var(--display);
  font-weight: 700;
  font-size: 19px;
  line-height: 1.2;
}
.facts {
  display: flex;
  gap: 8px 18px;
  flex-wrap: wrap;
  margin-top: 10px;
}
.facts div {
  font-size: 12.5px;
  color: var(--ink-2);
}
.facts b {
  display: block;
  font-size: 15px;
  color: var(--ink);
  font-family: var(--display);
}
.flow {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-top: 6px;
}
.flow .row {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.6fr) auto;
  gap: 10px;
  align-items: center;
  font-size: 13.5px;
}
.flow .row > span:first-child {
  overflow-wrap: anywhere;
}
.flow .bar {
  height: 10px;
  border-radius: 5px;
  background: var(--surface-2);
}
.flow .bar i {
  display: block;
  height: 100%;
  border-radius: 5px;
  background: var(--husk);
  transform-origin: left;
  animation: growx 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  box-shadow: 0 0 var(--mglow) var(--husk);
}
.flow .row.in .bar i {
  background: var(--accent-2);
  box-shadow: 0 0 var(--mglow) var(--accent-2);
}
.flow .row.net .bar i,
.flow .row.share .bar i {
  background: var(--accent);
  box-shadow: 0 0 var(--mglow) var(--accent);
}
:root[data-skin="light"] .flow .row.in .bar i {
  background: var(--ink-3);
}
.flow .row.net {
  font-weight: 700;
  border-top: 1px dashed var(--line);
  padding-top: 8px;
  margin-top: 2px;
}
.flow .row.share {
  font-weight: 700;
}
.flow .v {
  text-align: right;
  white-space: nowrap;
}
.flow .pct {
  color: var(--ink-3);
  font-size: 12px;
  margin-left: 6px;
  font-weight: 500;
}
.chart {
  position: relative;
  width: 100%;
}
.chart svg {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
}
.chart text {
  font-family: var(--body);
  font-size: 11px;
  fill: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.chart .gridl {
  stroke: var(--line);
  stroke-width: 1;
}
.chart .base {
  stroke: var(--ink-3);
  stroke-width: 1;
}
.chart .s1 {
  fill: var(--c1);
}
.chart .s2 {
  fill: var(--c2);
}
.chart .s3 {
  fill: var(--c3);
}
.chart .s4 {
  fill: var(--c4);
}
.chart .neg {
  fill: var(--bad);
}
.chart .ghost {
  fill: var(--c1);
  opacity: 0.35;
}
.chart .grow {
  transform-box: fill-box;
  transform-origin: bottom;
  animation: growy 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
.chart .grow.down {
  transform-origin: top;
}
.chart .ln {
  fill: none;
  stroke: var(--c1);
  stroke-width: 2;
  stroke-linejoin: round;
  stroke-linecap: round;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  animation: draw 1.1s ease-out 0.1s forwards;
  filter: drop-shadow(0 0 var(--mglow) var(--c1));
}
.chart .fc {
  fill: none;
  stroke: var(--c1);
  stroke-width: 2;
  stroke-dasharray: 5 5;
  animation: fade 0.6s 1s both;
}
.chart .band {
  fill: var(--c1);
  opacity: 0.14;
  animation: fadeband 0.6s 1s both;
}
.chart .area {
  fill: url(#ar);
  animation: fade 0.9s 0.3s both;
}
.chart .dot {
  fill: var(--c1);
  stroke: var(--surface);
  stroke-width: 2;
  animation: fade 0.4s 0.9s both;
}
.chart .dot.f {
  fill: var(--surface);
  stroke: var(--c1);
}
.chart .hit {
  fill: transparent;
}
.chart .hit:hover {
  fill: var(--ink);
  fill-opacity: 0.06;
}
.legend {
  display: flex;
  gap: 6px 14px;
  flex-wrap: wrap;
  font-size: 12.5px;
  color: var(--ink-2);
  margin-bottom: 6px;
}
.legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.view {

}
/* After the first screen, pages only slide and fade as one layer, and nothing inside them animates.
   That keeps tab changes light on budget phones. */
.view.calm {
  animation: none;
}
.view.calm.dir-fwd {
  animation: vInR 0.24s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
.view.calm.dir-back {
  animation: vInL 0.24s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
.view.calm.dir-fade {
  animation: vFadeIn 0.2s ease-out both;
}
.view.calm *,
.view.calm *::before,
.view.calm *::after {
  animation: none !important;
}
.view.calm .ln,
.view.calm .sp {
  stroke-dasharray: none !important;
  stroke-dashoffset: 0 !important;
}
.view.calm .prog {
  transition: none !important;
}
html.theme-vt::view-transition-old(root),
html.theme-vt::view-transition-new(root) {
  animation: none;
  mix-blend-mode: normal;
}
html.theming,
html.theming * {
  transition:
    background-color 0.45s ease,
    color 0.45s ease,
    border-color 0.45s ease,
    fill 0.45s ease,
    stroke 0.45s ease !important;
}
.stag > * {
  animation: rise 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
.stag > *:nth-child(2) {
  animation-delay: 0.05s;
}
.stag > *:nth-child(3) {
  animation-delay: 0.1s;
}
.stag > *:nth-child(4) {
  animation-delay: 0.15s;
}
.stag > *:nth-child(5) {
  animation-delay: 0.2s;
}
.stag > *:nth-child(6) {
  animation-delay: 0.25s;
}

#report {

}
body.rep #report {
  display: block;
  position: fixed;
  inset: 0;
  z-index: 80;
  overflow: auto;
  background: #fff;
  color: #15231b;
  color-scheme: light;
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #eef1ec;
  --line: #d5dcd1;
  --ink: #15231b;
  --ink-2: #4c5d52;
  --ink-3: #7c8b81;
  --accent: #1f7a4d;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe3;
  --accent-2: #3a78c2;
  --husk: #b4690e;
  --good: #1f7a4d;
  --bad: #bf3b26;
  --c1: #1f7a4d;
  --c2: #3a78c2;
  --c3: #d98a1f;
  --c4: #9a55b0;
  --btn-bg: #1f7a4d;

  --tglow: 0px;

}

#report .rmeta {

#report .pb i {

label.fld select {
  border: 1px solid var(--line);

  padding: 10px 11px;

@media (min-width: 600px) {

    grid-template-columns: repeat(4, 1fr);
  }
}
@media print {
  body {
    background: #fff !important;
  }
  body.rep > *:not(#report) {
    display: none !important;
  }
  body.rep #report {
    position: static;

  }

  }

  #report th,

  #report table.st {

  #report .st th {

    font-size: 22px;
  }
  #report .st tr.tot td {
    font-size: 13px;
  }
}
@page {
  size: A4;
  margin: 12mm;
}

@keyframes vInR {
  from {
    opacity: 0;
    transform: translateX(22px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes vInL {
  from {
    opacity: 0;
    transform: translateX(-22px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes vFadeIn {
  from {
    opacity: 0;
  }
}
@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes fade {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes fadeband {
  from {
    opacity: 0;
  }
  to {
    opacity: 0.14;
  }
}
@keyframes growy {
  from {
    transform: scaleY(0);
  }
  to {
    transform: scaleY(1);
  }
}
@keyframes growx {
  from {
    transform: scaleX(0);
  }
  to {
    transform: scaleX(1);
  }
}
@keyframes draw {
  to {
    stroke-dashoffset: 0;
  }
}
@keyframes sheet {
  from {
    transform: translateY(40px);
    opacity: 0;
  }
  to {
    transform: none;
    opacity: 1;
  }
}
@keyframes pulse {
  50% {
    opacity: 0.3;
  }
}
@keyframes glow {
  50% {
    opacity: 1;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-delay: 0s !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

@media (min-width: 640px) {
  .kpis {
    grid-template-columns: repeat(4, 1fr);
  }
  .fc-list {
    grid-template-columns: repeat(3, 1fr);
  }
  .fields.ded {
    grid-template-columns: repeat(4, 1fr);
  }
  .live {
    grid-template-columns: repeat(4, 1fr);
  }
  .pval {
    font-size: 84px;
  }
  .tothero .pval {
    font-size: 60px;
  }
  dialog {
    border-radius: 20px;
    margin: auto;
  }
}
@media (min-width: 920px) {
  .app {
    grid-template-columns: 216px 1fr;
  }
  .rail {
    position: sticky;
    top: 0;
    height: 100vh;
    flex-direction: column;
    justify-content: flex-start;
    gap: 4px;
    border-top: 0;
    border-right: 1px solid var(--line);
    padding: 18px 12px;
    right: auto;
  }
  .rail .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--display);
    font-weight: 700;
    font-size: 17px;
    padding: 4px 8px 16px;
  }
  .rail .brand svg {
    width: 30px;
    height: 30px;
    color: var(--accent);
    filter: drop-shadow(0 0 var(--mglow) var(--accent));
  }
  .rail button {
    flex: none;
    flex-direction: row;
    gap: 12px;
    font-size: 14.5px;
    padding: 10px 12px;
    justify-content: flex-start;
  }
  .rail button[aria-current="page"] svg {
    transform: none;
  }
  .rail .rail-foot {
    display: block;
    margin-top: auto;
    font-size: 12px;
    color: var(--ink-3);
    padding: 8px;
  }
  .main {
    padding: 26px 28px 40px;
  }
  .top h1 {
    flex: 1 1 180px;
  }
  .fab {
    display: none;
  }
  .top .add {
    display: inline-flex;
  }
  .card {
    transition:
      border-color 0.2s,
      transform 0.2s;
  }
  .card:hover {
    border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
  }
  .heroes {
    grid-template-columns: 1.1fr 1fr;
  }
  .two {
    grid-template-columns: 1.15fr 1fr;
  }
  .datagrid {
    grid-template-columns: 1fr 1fr;
  }
  #toast {
    bottom: 40px;
  }
}

/* ---------- no scroll bars on phones (they showed up on the dark background) ---------- */
@media (pointer: coarse) {
  html,
  body,
  * {
    scrollbar-width: none;
  }
  ::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
  }
}

/* ---------- App updates card ---------- */
.upd-ver {
  -webkit-user-select: none;
  user-select: none;
}
.devtools {
  margin-top: 14px;

  border-top: 1px dashed var(--line);
}

  gap: 4px;

.legal p {

  font-weight: 700;
  font-size: 16px;

/* ---------- full screen: keep content clear of the camera hole ----------
   The Android app sets --safe-top etc. to the camera cutout size; browsers use env(). */
:root {
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
.main {
  padding-top: calc(16px + var(--safe-top));
  padding-left: calc(16px + var(--safe-left));
  padding-right: calc(16px + var(--safe-right));
}
.rail {
  padding-bottom: calc(6px + var(--safe-bottom));
}
#report .rbar {
  padding-top: calc(10px + var(--safe-top));
}
@media (min-width: 920px) {
  .main {
    padding-top: calc(26px + var(--safe-top));
  }
  .rail {
    padding-top: calc(18px + var(--safe-top));
  }
}

/* ---------- loading screen ---------- */
#loader {
  --leaf: #2fd47f;
  --leaf-2: #1d9c5b;
  --trunk: #b98a5a;
  --nut: #8a5a2b;
  --lorry: #22d3ff;
  --cab: #2bffa0;
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding-top: var(--safe-top);
  background: var(--bg);
  transition: opacity 0.35s ease;
}
:root[data-skin="light"] #loader {
  --leaf: #2f9a55;
  --leaf-2: #237a42;
  --trunk: #9a6a3c;
  --nut: #7a4a22;
  --lorry: #3a78c2;
  --cab: #1f7a4d;
}
#loader.bye {
  opacity: 0;
  pointer-events: none;
}
.ld-scene {
  position: relative;
  width: 300px;
  height: 180px;
  overflow: hidden;
  animation: ldIn 0.4s ease-out both;
}
.ld-moon {
  position: absolute;
  left: 214px;
  top: 22px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--accent-2);
  opacity: 0.22;
  box-shadow: 0 0 40px 10px var(--accent-2);
}
:root[data-skin="light"] .ld-moon {
  background: #ffb020;
  box-shadow: 0 0 30px 6px #ffd27a;
  opacity: 0.55;
}
.ld-ground {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}
.ld-trunk {
  fill: none;
  stroke: var(--trunk);
  stroke-width: 10;
  stroke-linecap: round;
}
.ld-rings {
  fill: none;
  stroke: rgba(0, 0, 0, 0.28);
  stroke-width: 10;
  stroke-dasharray: 2 9;
}
.ld-land {
  fill: var(--surface-2);
}
.ld-crown {
  position: absolute;
  left: 58px;
  top: 14px;
  width: 120px;
  height: 80px;
  transform-origin: 60px 40px;
  animation: ldSway 2.4s ease-in-out infinite alternate;
}
.ld-crown svg,
.ld-lorry svg,
.ld-wheel svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
}
.ld-leaves path {
  fill: var(--leaf);
  stroke: var(--leaf-2);
  stroke-width: 1.2;
}
.ld-nuts circle,
.ld-drop,
.ld-load {
  fill: var(--nut);
  background: var(--nut);
}
.ld-drop {
  position: absolute;
  left: 112px;
  top: 64px;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  opacity: 0;
}
.ld-drop.d1 {
  animation:
    ldFall 0.32s cubic-bezier(0.55, 0, 1, 0.45) 1.05s forwards,
    ldGone 0.01s linear 1.37s forwards;
}
.ld-drop.d2 {
  --dx: -9px;
  animation:
    ldFall 0.32s cubic-bezier(0.55, 0, 1, 0.45) 1.15s forwards,
    ldGone 0.01s linear 1.47s forwards;
}
.ld-drop.d3 {
  --dx: 8px;
  animation:
    ldFall 0.32s cubic-bezier(0.55, 0, 1, 0.45) 1.25s forwards,
    ldGone 0.01s linear 1.57s forwards;
}
.ld-lorry {
  position: absolute;
  left: 78px;
  top: 121px;
  width: 130px;
  height: 50px;
  animation: ldDrive 2.1s both;
}
.ld-bed {
  fill: var(--lorry);
}
.ld-cab {
  fill: var(--cab);
}
.ld-slat {
  stroke: rgba(0, 0, 0, 0.22);
  stroke-width: 1.5;
}
.ld-glass {
  fill: var(--bg);
  opacity: 0.85;
}
.ld-chassis {
  fill: var(--ink-3);
}
.ld-lamp {
  fill: #ffd34d;
}
.ld-load {
  position: absolute;
  left: 12px;
  top: 4px;
  width: 54px;
  height: 14px;
  border-radius: 10px 10px 3px 3px;
  transform: scale(0);
  transform-origin: 50% 100%;
  animation: ldPop 0.25s cubic-bezier(0.3, 1.6, 0.5, 1) 1.5s forwards;
}
.ld-wheel {
  position: absolute;
  top: 32px;
  width: 18px;
  height: 18px;
  animation:
    ldSpin 0.35s linear 0.3s 2,
    ldSpin 0.35s linear 1.51s 2;
}
.ld-wheel.w1 {
  left: 13px;
}
.ld-wheel.w2 {
  left: 95px;
}
.ld-wheel circle {
  fill: #20262f;
  stroke: var(--ink-3);
  stroke-width: 2;
}
.ld-wheel path {
  stroke: var(--ink-3);
  stroke-width: 2;
}
.ld-name {
  font-family: var(--display);
  font-weight: 700;
  font-size: 24px;
  letter-spacing: -0.01em;
  color: var(--ink);
  animation: ldIn 0.5s ease-out 0.1s both;
}
.ld-bar {
  width: 150px;
  height: 4px;
  border-radius: 2px;
  background: var(--surface-2);
  overflow: hidden;
}
.ld-bar i {
  display: block;
  height: 100%;
  background: var(--accent);
  transform: scaleX(0.04);
  transform-origin: left;
  transition: transform 0.4s ease;
}
.ld-tag {
  margin: 0;
  font-size: 13px;
  color: var(--ink-3);
}
html[lang="si"] .ld-tag .en,
html:not([lang="si"]) .ld-tag .si {
  display: none;
}
@keyframes ldIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
}
@keyframes ldSway {
  from {
    transform: rotate(-6deg);
  }
  to {
    transform: rotate(5deg);
  }
}
@keyframes ldDrive {
  0%,
  14% {
    transform: translateX(-250px);
    animation-timing-function: cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  48%,
  72% {
    transform: translateX(0);
    animation-timing-function: cubic-bezier(0.6, 0, 0.9, 0.5);
  }
  100% {
    transform: translateX(260px);
  }
}
@keyframes ldSpin {
  to {
    transform: rotate(360deg);
  }
}
@keyframes ldFall {
  from {
    opacity: 1;
    transform: translate(0, 0);
  }
  to {
    opacity: 1;
    transform: translate(var(--dx, 0px), 60px);
  }
}
@keyframes ldGone {
  to {
    opacity: 0;
  }
}
@keyframes ldPop {
  to {
    transform: scale(1);
  }
}

  content-visibility: hidden;
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 0;
  overflow: hidden;
  pointer-events: none;
}

function pushCloud() {
  if (!docRef || state.sample) return;
  clearTimeout(pushT);
  pushT = setTimeout(async function run() {
    if (writing) {
      queued = true;
      return;
    }
    writing = true;
    setSync("busy", "sync_busy");
    try {
      await docRef.set({ updatedAt: state.updatedAt, json: JSON.stringify(state) });
      setSync("ok", "sync_ok");
    } catch (e) {
      setSync("", "sync_fail");
    }
    writing = false;
    if (queued) {
      queued = false;
      run();
    }
  }, 700);

/* Income = Loaded × price. Home use comes off the whole harvest first; what is left and not loaded is Rejected:

/* ---------- forecast models ----------
   Three small models: coconuts per day, price, and days between harvests.
   Each one is chosen by testing it on YOUR past harvests ("backtest"): pretend it is the day of an old
   harvest, predict it using only the records before it, and measure the error. The setting with the
   smallest average error wins, unless a simpler setting is within one standard error of it. This keeps
   the model from copying noise (overfitting) or ignoring real patterns (underfitting).
   Public knowledge is a starting point only, used when it predicts your own past harvests better:
   - Sri Lanka's national coconut output is usually highest around March to June and lowest around
     September to December (Central Bank of Sri Lanka bulletins, 2022 to 2024 monthly figures).
   - When supply is low, prices usually rise. */
const SEASON = { amp: 0.1, peak: 4.5 }; // national pattern: ±10%, peak in mid April
const monthPos = (ms) => {
  const d = new Date(ms);
  return d.getUTCMonth() + 1 + (d.getUTCDate() - 1) / 31;
};
const seasonF = (ms, amp) => 1 + amp * Math.cos((2 * Math.PI * (monthPos(ms) - SEASON.peak)) / 12);
const priceSeasonF = (ms, amp) => 1 - 0.5 * (seasonF(ms, amp) - 1); // less supply, higher price
const quant = (a, q) => {
  if (!a.length) return 0;
  const s = a.slice().sort((x, y) => x - y),
    i = (s.length - 1) * q,
    lo = Math.floor(i);
  return s[lo] + (s[Math.min(lo + 1, s.length - 1)] - s[lo]) * (i - lo);
};
const median = (a) => quant(a, 0.5);
/* Pick a config by its backtest error. Configs are listed from simplest to most complex. Following the
   "one standard error" rule, the simplest config whose error is within one standard error of the best
   wins: a more complex model has to be clearly better, not just luckier on a few harvests. */
function pickBest(configs, score) {
  const rs = configs.map((c) => ({ c, r: score(c) })).filter((x) => isFinite(x.r.mape));
  if (!rs.length) return null;
  const best = rs.reduce((a, b) => (b.r.mape < a.r.mape ? b : a)),
    ae = best.r.errs.map(Math.abs),
    se = ae.length > 1 ? sd(ae) / Math.sqrt(ae.length) : 0;
  return rs.find((x) => x.r.mape <= best.r.mape + se);
}
/* Relative errors (actual / predicted - 1) give the "likely" range; never narrower than ±floor. */
function bands(errs, floor) {
  if (errs.length >= 5) return { lo: Math.min(-floor, quant(errs, 0.1)), hi: Math.max(floor, quant(errs, 0.9)) };
  const s = Math.max(floor, errs.length ? Math.sqrt(mean(errs.map((e) => e * e))) * 1.3 : floor * 1.5);
  return { lo: -s, hi: s };
}

/* Coconuts per day between harvests, smoothed, optionally adjusted for the season. */
function yieldModel(hs) {
  const pts = [];
  for (let i = 1; i < hs.length; i++)
    if (hs[i].gap > 0) {
      const end = pd(hs[i].date),
        mid = end - (hs[i].gap * DAY) / 2;
      pts.push({ rate: hs[i].total / hs[i].gap, mid });
    }
  const run = (c, upto) => {
    const xs = pts.slice(0, upto).map((p) => p.rate / seasonF(p.mid, c.amp));
    return xs.length ? ewma(xs, c.a) : 0;
  };
  const configs = [];
  [0, SEASON.amp / 2, SEASON.amp].forEach((amp) => [0.45, 0.25, 0.7].forEach((a) => configs.push({ amp, a })));
  const score = (c) => {
    const errs = [];
    for (let i = 3; i < pts.length; i++) {
      const p = run(c, i) * seasonF(pts[i].mid, c.amp);
      if (p > 0) errs.push(pts[i].rate / p - 1);
    }
    return { errs, mape: errs.length >= 3 ? mean(errs.map(Math.abs)) : Infinity };
  };
  const best = pickBest(configs, score) || { c: { amp: SEASON.amp / 2, a: 0.45 }, r: { errs: [], mape: NaN } };
  const level = run(best.c, pts.length);
  return {
    c: best.c,
    tested: best.r.errs.length,
    mape: best.r.mape,
    band: bands(best.r.errs, 0.06),
    at: (fromMs, toMs) => level * seasonF((fromMs + toMs) / 2, best.c.amp) * ((toMs - fromMs) / DAY),
  };
}

/* Price: last price, a smoothed level, or a recent trend that fades out; optionally with the supply season. */
function priceModel(hs, gapDays) {
  const ps = hs.map((h) => ({ p: h.price, ms: pd(h.date) }));
  const fit = (c, upto) => {
    const xs = ps.slice(0, upto).map((x) => x.p / priceSeasonF(x.ms, c.amp));
    if (c.kind === "naive") return { L: xs[xs.length - 1], T: 0 };
    if (c.kind === "level") return { L: ewma(xs, c.a), T: 0 };
    let L = xs[0],
      T = xs.length > 1 ? xs[1] - xs[0] : 0;
    for (let i = 1; i < xs.length; i++) {
      const f = L + c.phi * T,
        L2 = c.a * xs[i] + (1 - c.a) * f;
      T = c.b * (L2 - L) + (1 - c.b) * c.phi * T;
      L = L2;
    }
    return { L, T };
  };
  const ahead = (c, m, steps) => {
    if (c.kind !== "trend" || steps <= 0) return m.L;
    const damp = (c.phi * (1 - Math.pow(c.phi, steps))) / (1 - c.phi);
    return m.L + m.T * damp;
  };
  const configs = [
    { kind: "naive", amp: 0 },
    { kind: "level", a: 0.5, amp: 0 },
    { kind: "trend", a: 0.5, b: 0.3, phi: 0.85, amp: 0 },
    { kind: "trend", a: 0.6, b: 0.2, phi: 0.92, amp: 0 },
    { kind: "trend", a: 0.5, b: 0.3, phi: 0.85, amp: SEASON.amp },
  ];
  const score = (c) => {
    const errs = [];
    for (let i = 3; i < ps.length; i++) {
      const m = fit(c, i),
        p = ahead(c, m, 1) * priceSeasonF(ps[i].ms, c.amp);
      if (p > 0) errs.push(ps[i].p / p - 1);
    }
    return { errs, mape: errs.length >= 3 ? mean(errs.map(Math.abs)) : Infinity };
  };
  const best = pickBest(configs, score) || { c: configs[2], r: { errs: [], mape: NaN } };
  const m = fit(best.c, ps.length),
    lastMs = ps[ps.length - 1].ms,
    band = bands(best.r.errs, 0.03);
  return {
    c: best.c,
    tested: best.r.errs.length,
    mape: best.r.mape,
    at: (ms) => {
      const steps = Math.max(0, (ms - lastMs) / DAY / gapDays),
        p = Math.max(0, ahead(best.c, m, steps) * priceSeasonF(ms, best.c.amp)),
        w = Math.sqrt(Math.max(1, steps));
      return { p, lo: Math.max(0, p * (1 + band.lo * w)), hi: p * (1 + band.hi * w) };
    },
  };
}

/* Days between harvests: the middle value of recent gaps, or a smoothed value. */
function gapModel(hs) {
  const gs = hs
    .slice(1)
    .map((h) => h.gap)
    .filter((g) => g > 0);
  const configs = [
    { kind: "median", k: 6 },
    { kind: "ewma", a: 0.35 },
    { kind: "ewma", a: 0.6 },
  ];
  const pred = (c, xs) => (c.kind === "median" ? median(xs.slice(-c.k)) : ewma(xs, c.a));
  const score = (c) => {
    const errs = [];
    for (let i = 2; i < gs.length; i++) errs.push(gs[i] / pred(c, gs.slice(0, i)) - 1);
    return { errs, mape: errs.length >= 3 ? mean(errs.map(Math.abs)) : Infinity };
  };
  const best = pickBest(configs, score) || { c: configs[0], r: { errs: [], mape: NaN } };
  const recent = gs.slice(-8);
  return {
    c: best.c,
    tested: best.r.errs.length,
    mape: best.r.mape,
    gap: Math.max(1, Math.round(pred(best.c, gs))),
    lo: Math.round(quant(recent, 0.2)),
    hi: Math.round(quant(recent, 0.8)),
    min: Math.min.apply(0, gs),
    max: Math.max.apply(0, gs),
  };
}

function forecast(hs) {
  const n = hs.length;
  if (n < 3 || hs.slice(1).filter((h) => h.gap > 0).length < 2) return null;
  const G = gapModel(hs),
    Y = yieldModel(hs),
    P = priceModel(hs, G.gap);
  const loadRate = ewma(
      hs.slice(-6).map((h) => (h.total ? h.loaded / h.total : 0)),
      0.4,
    ),
    dedT = sum(CATS.map((c) => mean(hs.slice(-6).map((h) => h.dv[c])))),
    transNow = mean(hs.slice(-6).map((h) => h.dv.transport)),
    last = pd(hs[n - 1].date);
  const step = (from, to, k) => {
    const nuts = Y.at(from, to),
      pr = P.at(to),
      w = Math.sqrt(k),
      loaded = nuts * loadRate,
      ded = dedT - transNow + nuts * state.transRate,
      net = loaded * pr.p - ded;
    return {
      k,
      date: to,
      nuts,
      nutsLo: Math.max(0, nuts * (1 + Y.band.lo * w)),
      nutsHi: nuts * (1 + Y.band.hi * w),
      loaded,
      paid: loaded,
      price: pr.p,
      pLo: pr.lo,
      pHi: pr.hi,
      inc: loaded * pr.p,
      dedT: ded,
      net,
      share: net / state.shares,
    };
  };
  const steps = [];
  for (let k = 1, from = last; k <= 3; k++, from += G.gap * DAY) steps.push(step(from, from + G.gap * DAY, k));
  /* the next 12 months from today */
  const now = todayMs(),
    yearEnd = now + 365 * DAY,
    year = [];
  for (let k = 1, from = last; from + G.gap * DAY <= yearEnd && k < 60; k++, from += G.gap * DAY)
    if (from + G.gap * DAY > now) year.push(step(from, from + G.gap * DAY, Math.min(k, 6)));
  /* next calendar month */
  const d = new Date(),
    nmStart = Date.UTC(d.getFullYear(), d.getMonth() + 1, 1),
    nmEnd = Date.UTC(d.getFullYear(), d.getMonth() + 2, 1),
    nmPrice = P.at((nmStart + nmEnd) / 2),
    nmHarv = year.filter((x) => x.date >= nmStart && x.date < nmEnd);
  const tested = Math.min(Y.tested, P.tested);
  const errs = [P.mape, Y.mape].filter(isFinite);
  const worst = errs.length ? Math.max.apply(0, errs) : 1;
  const conf = tested < 3 ? 1 : worst < 0.06 ? 3 : worst < 0.12 ? 2 : 1;
  return {
    n,
    gap: G.gap,
    gapLo: G.lo,
    gapHi: G.hi,
    G,
    Y,
    P,
    rate: Y.at(last, last + DAY),
    paidRate: loadRate,
    steps,
    year,
    nm: { start: nmStart, price: nmPrice, harvests: nmHarv },
    conf,
    tested,
  };
}

/* ---------- charts ---------- */
function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw || 1))),
    m = raw / p;
  return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
}
const tips = new Map();

function barChart(el, data, opt) {

  const mx = Math.max.apply(0, tops.concat(1)),

function lineChart(el, pts, fc, opt) {
  if (!el) return;
  opt = opt || {};

    all = pts.concat(fc),
    n = all.length,
    pw = f.W - f.L - f.R,
    ph = f.H - f.T - f.B;
  const vals = pts
      .map((p) => p.v)
      .concat(
        fc.map((p) => p.lo),
        fc.map((p) => p.hi),
      ),
    mn = Math.min.apply(0, vals),
    mx = Math.max.apply(0, vals);
  const st = niceStep((mx - mn || mx || 1) / 3),
    lo = Math.max(0, Math.floor((mn - st * 0.2) / st) * st),
    hi = Math.ceil((mx + st * 0.1) / st) * st || 1;
  const cx = (i) => (n > 1 ? f.L + 10 + ((pw - 20) * i) / (n - 1) : f.L + pw / 2),
    y = (v) => f.T + ph * (1 - (v - lo) / (hi - lo));
  let g = "";
  for (let v = lo; v <= hi + 1e-9; v += st)
    g += `<line class="gridl" x1="${f.L}" x2="${f.W - f.R}" y1="${y(v)}" y2="${y(v)}"/><text x="${f.L - 6}" y="${y(v) + 4}" text-anchor="end">${short(v)}</text>`;

    s += `<path class="area" d="M${P.join("L")}L${cx(m - 1)},${y(lo)}L${cx(0)},${y(lo)}z"/><path class="ln" pathLength="1" d="M${P.join("L")}"/>`;
  }

      u = a.slice(),

  });
  el.innerHTML = `<svg viewBox="0 0 ${f.W} ${f.H}" role="img" aria-label="${esc(opt.label || "")}">${g}${s}${xLabels(
    f,
    all.map((p) => p.label),

function spark(el, vals) {

/* ---------- pages kept in memory ----------
   Each tab is built once and kept. Switching tabs only puts the kept page back on screen, so it is
   instant. Saving a record, changing a setting or the language clears the kept pages; the page on
   screen is rebuilt at once and the others when they are next opened.
   At start-up the loading screen builds every tab while its animation plays. */
const pages = {};
let rendered = false;
const VIEWS = { overview: vOverview, months: vMonths, insights: vInsights, forecast: vForecast, data: vData };
function invalidate() {
  for (const k in pages) {
    if (k !== route && pages[k].parentNode) pages[k].remove();
    delete pages[k];
  }

}
/* Every kept page stays in the document. Pages not on screen use content-visibility: hidden, so the
   browser keeps their layout ready and skips drawing them; showing one again is quick. */
function showPage(el) {
  for (const k in pages) if (pages[k] !== el) pages[k].classList.remove("on");
  [...view.children].forEach((c) => c !== el && c.classList.remove("on"));
  el.classList.add("on");
}
function header() {

    .querySelectorAll(".rail [data-go]")
    .forEach((b) =>
      b.dataset.go === route ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"),
    );
}
/* Builds tab r and puts it on screen (it must be on screen so the charts can measure their width). */
function build(r, intro) {
  drawFns = [];
  const el = document.createElement("div");
  el.className = "view" + (intro ? "" : " calm");
  el.innerHTML = VIEWS[r](calc());
  if (pages[r] && pages[r].parentNode) pages[r].replaceWith(el);
  else view.appendChild(el);
  [...view.children].forEach((c) => !Object.values(pages).includes(c) && c !== el && c.remove());
  showPage(el);
  draw(el);
  if (!intro) el.querySelectorAll(".prog").forEach((c) => (c.style.strokeDashoffset = c.dataset.off));
  pages[r] = el;
  return el;
}
function slideIn(el, dir) {

  const from = dir === "fade" ? "none" : `translateX(${dir === "back" ? -18 : 18}px)`;
  el.animate(
    [
      { opacity: 0, transform: from },
      { opacity: 1, transform: "none" },
    ],
    {
      duration: dir === "fade" ? 200 : 220,
      easing: "cubic-bezier(.2,.8,.2,1)",
    },

}
function render(o) {
  o = o || {};

}
function draw(root) {
  widthOf.clear();
  (root || view).querySelectorAll(".chart,.spark").forEach((el) => widthOf.set(el, el.clientWidth));
  drawFns.forEach((f) => {
    try {
      f();
    } catch (e) {
      console.error(e);
    }
  });
}
function countUp() {

    const to = +el.dataset.count;
    if (still || !isFinite(to)) return;
    const t0 = performance.now(),
      dur = 800;
    (function step(now) {

function parseDate(s) {
  s = s.trim();
  let m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);
  if (m) return m[1] + "-" + m[2].padStart(2, "0") + "-" + m[3].padStart(2, "0");
  m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/);
  if (m) return m[3] + "-" + m[2].padStart(2, "0") + "-" + m[1].padStart(2, "0");
  return null;
}
function splitRow(line) {
  const d = line.includes("\t") ? "\t" : line.includes(";") && !line.includes(",") ? ";" : ",",
    out = [];
  let cur = "",
    inq = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inq) {
      if (ch === '"') {
        if (line[i + 1] === '"') {
          cur += '"';
          i++;
        } else inq = false;
      } else cur += ch;
    } else if (ch === '"') inq = true;
    else if (ch === d) {
      out.push(cur.trim());
      cur = "";
    } else cur += ch;
  }
  out.push(cur.trim());
  return out;
}
function importText(txt) {

  if (!txt) throw t("i_none");
  if (txt[0] === "{") {
    let o;
    try {
      o = JSON.parse(txt);
    } catch (e) {
      throw t("i_bad");
    }
    if (!o || !Array.isArray(o.harvests)) throw t("i_notbk");
    return { replace: Object.assign(o, { sample: false }), count: o.harvests.length };
  }
  const out = [];
  txt.split(/\r?\n/).forEach((line, ln) => {
    if (!line.trim()) return;
    const c = splitRow(line),
      date = parseDate(c[0] || "");
    if (!date) {
      if (ln === 0) return;
      throw t("i_date", ln + 1, c[0]);
    }
    const n = (i) => {
      const v = parseFloat((c[i] || "").replace(/[^\d.\-]/g, ""));
      return isFinite(v) ? v : 0;
    };
    if (n(1) <= 0) throw t("i_count", ln + 1);
    if (n(2) + n(3) > n(1)) throw t("i_sum", ln + 1);
    const ded = {};
    CATS.forEach((k, i) => (ded[k] = k === "transport" && (c[5 + i] || "") === "" ? null : n(5 + i)));
    out.push({
      id: uid(),
      date,
      total: Math.round(n(1)),
      rejected: Math.round(n(2)),
      home: Math.round(n(3)),
      free: (c[18] || "") === "" ? null : Math.round(n(18)),
      loaded: (c[19] || "") === "" ? null : Math.round(n(19)),
      price: n(4),
      ded,
      buyer: c[13] || "",
      contact: c[14] || "",
      by: c[15] || "",
      note: c[16] || "",
      otherNote: c[17] || "",
    });
  });

          `<tr><td>${fd(h.date)}</td><td class="pr">${price(h.price)}</td><td>${N(h.total)}</td><td>${N(h.loaded)}</td><td>${N(h.rejected)}</td><td>${N(h.home)}</td><td>${N(h.free)}</td><td>${N(h.inc)}</td><td>${N(h.dedT)}</td><td><b>${N(h.net)}</b></td><td>${esc(h.buyer || "")}</td></tr>`,
      )
      .join("")}</tbody></table></div></div>
  ${fc ? `<div class="card"><h2>${t("next3")}</h2><p class="hint">${t("rep_fc_note")}</p><div class="fc-list">${fc.steps.map((x) => `<div class="fc-item"><h3>${t("around", fd(x.date))}</h3><p class="num">≈ ${price(Math.round(x.price))} ${t("per_coconut")}</p><p class="num">≈ ${N(x.nuts)} ${t("harvested")} · ${t("n_loaded", N(x.loaded)).replace("≈ ", "")}</p><p class="num">≈ ${money(x.net)} · ${t("balance")}</p></div>`).join("")}</div></div>` : ""}
  </div>`;
  repName = "coconut-report-" + iso(todayMs());
  document.body.classList.add("rep");
  $("#report").scrollTop = 0;
  lineChart($("#r-price"), priceData(hs), [], { label: t("price_chart_h"), w: 720, h: 230 });
  barChart($("#r-nuts"), nutsData(hs), { label: t("per_harvest_h"), w: 720, h: 230 });
  barChart(
    $("#r-net"),
    hs.map((h) => ({ label: fd(h.date, false), segs: [{ v: h.net, cls: h.net < 0 ? "neg" : "s1" }], tip: "" })),
    { label: t("bal_per_h"), w: 720, h: 200 },
  );
}
/* ---------- monthly report: one month as a statement, with the full deduction breakdown ---------- */
let repName = "coconut-report";
function agg(l) {
  const S = (f) => sum(l.map(f)),
    dv = {};
  CATS.forEach((c) => (dv[c] = S((h) => h.dv[c])));
  const loaded = S((h) => h.loaded),
    inc = S((h) => h.inc),
    dedT = S((h) => h.dedT);
  return {
    total: S((h) => h.total),
    loaded,
    rejected: S((h) => h.rejected),
    home: S((h) => h.home),
    free: S((h) => h.free),
    inc,
    dv,
    dedT,
    net: inc - dedT,
    share: (inc - dedT) / state.shares,
    price: loaded ? inc / loaded : mean(l.map((h) => h.price)),
    otherNote: l
      .map((h) => h.otherNote)
      .filter(Boolean)
      .join("; "),
    transAuto: l.every((h) => blank(h.ded.transport)),
  };
}
function cocoTable(o) {
  const R = (l, v, c) => `<tr class="${c || ""}"><td>${l}</td><td>${v}</td></tr>`;
  return `<table class="st two num"><tbody>${R(t("harvested"), N(o.total))}${R(t("home"), "− " + N(o.home))}${R(t("rejected"), "− " + N(o.rejected))}${R(t("loaded_lab"), N(o.loaded), "tot")}${state.freePer > 0 ? R(t("free") + " (" + freeRule() + ")", N(o.free), "shr") : ""}</tbody></table>`;
}
function moneyTable(o) {
  const pc = (v) => (o.inc ? ((v / o.inc) * 100).toFixed(1) + "%" : "–"),
    bar = (v) =>
      `<span class="pb"><i style="width:${o.inc ? Math.min(100, Math.max(0, (v / o.inc) * 100)) : 0}%"></i></span>`;
  return `<table class="st num"><thead><tr><th>${t("rep_item")}</th><th>${t("rep_note")}</th><th>${t("rep_amount", esc(state.cur))}</th><th>${t("rep_pct")}</th></tr></thead><tbody>
  <tr class="sub"><td>${t("income")}</td><td>${N(o.loaded)} × ${price(o.price)}</td><td>${N(o.inc)}</td><td>100%</td></tr>
  ${CATS.map((c) => `<tr><td>${t("cat_" + c)}</td><td>${c === "transport" && o.transAuto ? t("per_harv_x", N(o.total), price(state.transRate)) : c === "other" ? esc(o.otherNote) : ""}</td><td>${o.dv[c] ? "− " + N(o.dv[c]) : "0"}</td><td>${bar(o.dv[c])}${pc(o.dv[c])}</td></tr>`).join("")}
  <tr class="sub"><td>${t("rep_totded")}</td><td></td><td>− ${N(o.dedT)}</td><td>${pc(o.dedT)}</td></tr>
  <tr class="tot"><td>${t("balance")}</td><td></td><td>${money(o.net)}</td><td>${pc(o.net)}</td></tr>
  ${state.shares > 1 ? `<tr class="shr"><td>${esc(shareLab())} (÷ ${state.shares})</td><td></td><td>${money(o.share)}</td><td></td></tr>` : ""}</tbody></table>`;
}
function openMonthReport(key) {
  const ms = monthly(calc()),
    i = ms.findIndex((m) => m.key === key);
  if (i < 0) return toast(t("empty_h"));
  const m = ms[i],
    pm = ms[i - 1],
    o = agg(m.list),
    po = pm && agg(pm.list),
    multi = m.list.length > 1,
    sh = state.shares > 1;
  const T = (l, v) => `<div class="rt"><span>${l}</span><b>${v}</b></div>`;
  const det = (h) =>
    `<p class="rdet">${t("f_date")}: <b>${fd(h.date)}</b>${h.gap != null ? ` (${t("days_after", h.gap)})` : ""} · ${t("buyer")}: <b>${h.buyer ? esc(h.buyer) : t("not_rec")}</b>${h.contact ? ` · ${t("contact")}: <b>${esc(h.contact)}</b>` : ""} · ${t("entered_by")}: <b>${h.by ? esc(h.by) : t("not_rec")}</b>${h.note ? `<br>${esc(h.note)}` : ""}</p>`;
  const block = (x) =>
    `<div class="card"><h2>${t("rep_coco")}</h2>${cocoTable(x)}</div><div class="card"><h2>${t("rep_money")}</h2>${moneyTable(x)}</div>`;
  $("#report").innerHTML =
    `<div class="rbar noprint"><button class="btn primary" id="repPrint">${t("rep_save")}</button><button class="btn" id="repClose">${t("rep_close")}</button><span>${t("rep_hint")}</span></div>
  <div class="page"><div class="rhead"><div><h1>${esc(state.estate)}</h1><p>${t("rep_month")} · <b>${m.label}</b> · ${m.list.length === 1 && lang === "en" ? "1 harvest" : t("n_harvests", m.list.length)}</p></div><p class="rmeta">${t("rep_made", fd(todayMs()))}<br>${t("version", VER)}</p></div>
  <h3 class="sec">${t("rep_sum")}</h3>
  <div class="rk num">${T(t("price_lab"), price(o.price))}${T(t("loaded"), N(o.loaded))}${T(t("harvested"), N(o.total))}${T(t("rejected"), N(o.rejected))}
    ${T(t("income"), money(o.inc))}${T(t("deductions"), money(o.dedT))}${T(t("balance"), money(o.net))}${sh ? T(esc(shareLab()), money(o.share)) : T(t("home"), N(o.home))}</div>
  ${po ? `<div class="card rcmp"><b>${t("rep_cmp", pm.label)}</b><span>${t("price")} ${delta(o.price, po.price)}</span><span>${t("loaded")} ${delta(o.loaded, po.loaded)}</span><span>${t("income")} ${delta(o.inc, po.inc)}</span><span>${t("balance")} ${delta(o.net, po.net)}</span></div>` : ""}
  ${multi ? `<h3 class="sec">${t("rep_mtotal")}</h3>${block(o)}` + m.list.map((h) => `<h3 class="sec">${t("rep_harv_on", fd(h.date))}</h3>${det(h)}${block(agg([h]))}`).join("") : `<h3 class="sec">${t("rep_details")}</h3>${det(m.list[0])}${block(o)}`}
  <p class="rfoot">Coconut Estate Ledger · ${t("version", VER)} · ${t("rep_made", fd(todayMs()))}</p>
  </div>`;
  repName = "coconut-report-" + key;
  document.body.classList.add("rep");
  $("#report").scrollTop = 0;
}
function closeReport() {
  document.body.classList.remove("rep");
  $("#report").innerHTML = "";
}
function printReport() {
  const name = repName;
  if (NB && NB.printPage) {
    NB.printPage(name);
    return;
  }
  try {
    window.print();
  } catch (e) {}
}

/* ---------- events ---------- */
function setSkin(s) {
  if (s === "light") document.documentElement.setAttribute("data-skin", "light");
  else document.documentElement.removeAttribute("data-skin");
  LS.set("coconut-ledger-skin", s);
  mirror();
}
/* Seven taps on the version line in Data > App updates show the developer options. */
let devTimer = 0;
document.addEventListener("click", (e) => {
  const v = e.target.closest && e.target.closest("[data-devtap]");
  if (!v || devOpen) return;
  clearTimeout(devTimer);
  devTimer = setTimeout(() => (devTaps = 0), 3000);
  if (++devTaps >= 7) {
    devOpen = true;
    const c = $("#updCard");
    if (c) c.insertAdjacentHTML("beforeend", devTools());
    toast(t("dev_on"));
  }
});
document.addEventListener("click", async (e) => {
  const b = e.target.closest("button,[data-go]");
  if (!b) return;
  if (b.dataset.go) return go(b.dataset.go);
  if (b.dataset.lang) {
    if (b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    LS.set("coconut-ledger-lang", lang);
    mirror();
    return render({ dir: still() ? "" : "fade" });
  }
  if (b.id === "skinBtn") return toggleSkin(e);
  if (b.dataset.upd && UPD) {
    const k = b.dataset.upd,
      inp = $("#u-link");
    if (k === "save" || (k === "check" && inp && inp.value.trim() !== (SH.updateUrl || ""))) {
      if (NB.setUpdateUrl(inp ? inp.value : "") !== "ok") return toast(t("upd_badlink"));
      readShell();
      if (k === "save") {
        const el = $("#updSt");
        if (el) el.innerHTML = updStatusHtml();
        return toast(t("upd_saved"));
      }
    }
    if (k === "check") return NB.checkForUpdates();
    if (k === "install") return NB.installUpdate();
    if (k === "restart") return NB.restart();
    return;
  }
  if (b.hasAttribute("data-pdf")) return openReport();
  if (b.dataset.mpdf) return openMonthReport(b.dataset.mpdf);
  if (b.hasAttribute("data-mpick")) return openMonthReport($("#mpick").value);
  if (b.id === "repPrint") return printReport();
  if (b.id === "repClose") return closeReport();
  if (b.hasAttribute("data-add")) return openForm();
  if (b.dataset.edit) return openForm(b.dataset.edit);
  if (b.hasAttribute("data-close")) return closeD(dlg);
  if (b.dataset.range) {
    range = b.dataset.range;
    return render();
  }
  if (b.hasAttribute("data-clear")) {
    if (await confirmBox(t("c_clear_h"), t("c_clear_p"), t("clear"))) {
      state.harvests = [];
      state.sample = false;
      persist();
      render();
    }
    return;
  }
  if (b.hasAttribute("data-wipe")) {
    if (await confirmBox(t("c_wipe_h"), t("c_wipe_p"), t("delete_all"))) {
      state.harvests = [];
      state.sample = false;
      persist();
      go("overview");
    }
    return;
  }
  if (b.dataset.exp === "share") return shareFile("coconut-harvests-" + iso(todayMs()) + ".csv", toCSV());
  if (b.dataset.exp === "json") return saveFile("coconut-backup-" + iso(todayMs()) + ".json", JSON.stringify(state));
  if (b.dataset.exp === "csv") return saveFile("coconut-harvests-" + iso(todayMs()) + ".csv", toCSV());
  if (b.dataset.exp === "copy") {
    try {
      await navigator.clipboard.writeText(JSON.stringify(state));
      toast(t("t_copied"));
    } catch (x) {
      $("#imp").value = JSON.stringify(state);
      toast(t("t_copyblock"));
    }
    return;
  }
  if (b.id === "s-save") {
    state.estate = $("#s-name").value.trim() || "My coconut estate";
    state.cur = $("#s-cur").value.trim() || "Rs";
    state.freePer = Math.max(0, Math.round(val("s-free")));
    state.shares = Math.max(1, Math.round(val("s-shares")) || 1);
    state.shareName = $("#s-sname").value.trim() || "share";
    state.transRate = Math.max(0, val("s-trans"));
    persist();
    render();
    return toast(t("t_details"));
  }
  if (b.id === "impGo") return doImport($("#imp").value);
});
document.addEventListener("change", (e) => {
  if (e.target.id === "impFile" && e.target.files[0]) {
    const r = new FileReader();
    r.onload = () => doImport(String(r.result));
    r.readAsText(e.target.files[0]);
    e.target.value = "";
  }
});

if (LS.get("coconut-ledger-skin") === "light") setSkin("light");
route = ROUTES.indexOf(location.hash.slice(1)) >= 0 ? location.hash.slice(1) : "overview";
readShell();
/* Start-up: the loading screen plays while every tab is built and kept in memory. */
(async function boot() {
  const loader = $("#loader"),
    bar = $("#ldBar"),
    t0 = performance.now(),
    order = ROUTES.filter((r) => r !== route),
    tick = () => new Promise((res) => setTimeout(res, 0));
  header();
  for (let i = 0; i < order.length; i++) {
    await tick();
    try {
      build(order[i], false);
    } catch (e) {
      console.error(e);
    }
    if (bar) bar.style.transform = `scaleX(${(i + 1) / (order.length + 1)})`;
  }
  if (loader && !still()) await new Promise((res) => setTimeout(res, Math.max(0, 2150 - (performance.now() - t0))));
  header();
  const el = build(route, true);
  rendered = true;
  moveInd();
  if (bar) bar.style.transform = "scaleX(1)";
  countUp();
  requestAnimationFrame(() =>
    requestAnimationFrame(() =>
      el.querySelectorAll(".prog").forEach((c) => (c.style.strokeDashoffset = c.dataset.off)),
    ),
  );
  /* once the opening animation is over, the page behaves like every other kept page */
  setTimeout(() => el.classList.add("calm"), 1800);
  if (loader) {
    loader.classList.add("bye");
    setTimeout(() => loader.remove(), 450);
  }
  initCloud();
  mirror();
  showPendingNote();
})();
/* An update applied while the app was in the background is announced when the person comes back. */
let pendingNote = "";
function showPendingNote() {
  pendingNote = SH.justApplied ? t("upd_applied", SH.justApplied) : "";
  if (pendingNote && document.visibilityState !== "hidden") {
    toast(pendingNote);
    pendingNote = "";
  }
}
window.onAppResume = () => {
  if (pendingNote) {
    setTimeout(() => toast(pendingNote), 250);
    pendingNote = "";
  }
};
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") window.onAppResume();
});
/* The Android app asks this before swapping in a new version in the background. */
window.canReload = () => {
  if (dlg.open || ask.open || document.body.classList.contains("rep")) return false;
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return false;
  const imp = $("#imp");
  return !(imp && imp.value.trim());
};
