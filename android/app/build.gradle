plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// The app's version lives in one place: apk/apk_info.json (make_release.py reads it too).
def apkInfo = new groovy.json.JsonSlurper().parse(rootProject.file('../apk/apk_info.json'))
def ciStoreFile = System.getenv('ANDROID_KEYSTORE_PATH')
def ciStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def ciKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def ciKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def ciSigningConfigured = [ciStoreFile, ciStorePassword, ciKeyAlias, ciKeyPassword].any { it != null }
if (ciSigningConfigured && [ciStoreFile, ciStorePassword, ciKeyAlias, ciKeyPassword].any { !it }) {
    throw new GradleException('Android release signing requires ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD.')
}

android {
    namespace 'com.estateledger.coconut'
    compileSdk 34

    if (ciSigningConfigured) {
        signingConfigs {
            ciRelease {
                storeFile file(ciStoreFile)
                storePassword ciStorePassword
                keyAlias ciKeyAlias
                keyPassword ciKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId 'com.estateledger.coconut'
        minSdk 24
        targetSdk 34
        versionCode apkInfo.versionCode as int
        versionName apkInfo.versionName as String
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ciSigningConfigured) signingConfig signingConfigs.ciRelease
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.2.0')
    implementation 'com.google.firebase:firebase-messaging'
}

// The page must be built into the app before every build: python tools/build_page.py
tasks.register('checkPage') {
    doLast {
        if (!file('src/main/assets/index.html').exists()) {
            throw new GradleException('The page is missing. In a terminal at the project folder run:  python tools/build_page.py')
        }
    }
}
tasks.named('preBuild') { dependsOn 'checkPage' }
